[package]
name = "castly"
version = "0.7.1"
edition = "2021"

[dependencies]
# Error handling
thiserror = "2.0"

# API
axum = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Asynchronous tasks
tokio = { version = "1.42", features = ["full"] }

# Config from yaml or configmap
config = "0.15"
serde_yaml = "0.9.34+deprecated"

# HTTP calls
reqwest = { version = "0.12", features = ["json"] }

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Template
tera = "1.0"

[dev-dependencies]
# Testing
tokio-test = "0.4"
tempfile = "3.15"